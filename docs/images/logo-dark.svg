<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Augments">
  <title>Augments</title>
  <defs>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="488">
      <stop offset="0" stop-color="#F4D293"/>
      <stop offset="1" stop-color="#D9A551"/>
    </linearGradient>
  </defs>

  <!-- The agent: a model that acts. -->
  <g stroke="url(#brass)" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <rect x="163.0" y="112.0" width="186.0" height="160.0" rx="37.2"/>
    <line x1="256.0" y1="110.0" x2="256.0" y2="76.0"/>
    <line x1="222.5" y1="235.2" x2="289.5" y2="235.2" stroke-width="14.4"/>
  </g>
  <g fill="url(#brass)">
    <circle cx="256.0" cy="60.0" r="18"/>
    <circle cx="213.8" cy="179.2" r="15"/>
    <circle cx="298.2" cy="179.2" r="15"/>
  </g>

  <!-- The augment: capability added, never taken over. -->
  <g stroke="url(#brass)" stroke-width="18" stroke-linecap="round">
    <line x1="410" y1="58" x2="410" y2="126"/>
    <line x1="376" y1="92" x2="444" y2="92"/>
  </g>

  <!-- The system it runs in: tools and peers, wired explicitly. -->
  <g fill="none" stroke="url(#brass)" stroke-width="7" stroke-linecap="round" opacity="0.6">
    <path d="M 256 272 L 256 330"/>
    <path d="M 256 330 L 120 420"/>
    <path d="M 256 330 L 256 440"/>
    <path d="M 256 330 L 392 420"/>
  </g>
  <g fill="url(#brass)">
    <circle cx="256" cy="330" r="12"/>
    <circle cx="120" cy="420" r="22"/>
    <circle cx="256" cy="440" r="22"/>
    <circle cx="392" cy="420" r="22"/>
  </g>
</svg>
