version: 2
updates:
  # Keep GitHub Actions pinned and current. Grouped into one PR per run so
  # action bumps don't fan out into noise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies declared in pyproject.toml and pinned in uv.lock —
  # the `uv` ecosystem updates both together. Security updates are delivered
  # out-of-band by Dependabot alerts regardless of this cadence.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # Provider SDK majors need code migration in llms/<provider>/ and must
    # stay compatible with litellm; bump them deliberately, not via the
    # grouped PR (one breaking major blocks every routine bump with it).
    ignore:
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
    groups:
      python-dev:
        patterns: ["*"]
