version: 2
updates:
  # Keep GitHub Actions pinned and current. Grouped into one PR per run so
  # action bumps don't fan out into noise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies declared in pyproject.toml and pinned in uv.lock —
  # the `uv` ecosystem updates both together. Security updates are delivered
  # out-of-band by Dependabot alerts regardless of this cadence.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # openai majors wait for a litellm release that accepts them (every
    # litellm release so far requires openai<3), so they are bumped
    # deliberately rather than in the grouped PR, where one unresolvable
    # major would block every routine bump with it.
    ignore:
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    groups:
      python-dev:
        patterns: ["*"]
